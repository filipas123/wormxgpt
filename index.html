<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="WormGPT - Advanced Multi-Provider AI Terminal featuring 108+ frontier and local model providers, auto-fallback matrix, MCP tool ecosystem, vision arbitrage, and multi-agent orchestration">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ef4444">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:title" content="WormGPT Red Terminal">
  <meta property="og:description" content="WormGPT - Advanced Multi-Provider AI Hacker Terminal with Red Neon Glow, multi-model arbitrage, and MCP tools">
  <meta property="og:type" content="website">
  <!-- Preconnect to common API endpoints -->
  <link rel="preconnect" href="https://text.pollinations.ai" crossorigin>
  <link rel="preconnect" href="https://api.groq.com" crossorigin>
  <link rel="preconnect" href="https://generativelanguage.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://js.puter.com" crossorigin>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>WormGPT Red Terminal</title>
  <!-- Puter.js SDK for Keyless & Free AI Access -->
  <script src="https://js.puter.com/v2/"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Red terminal palette bridge: maps legacy indigo/slate/zinc/emerald utility
       classes onto the home screen palette so every panel matches. -->
  <link rel="stylesheet" href="/theme-terminal.css">
  <style>
    * { box-sizing: border-box; }
    
    html { color-scheme: dark; }

    body {
      font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: #050102;
      color: #fee2e2;
      overflow: hidden;
      margin: 0;
      padding: 0;
      height: 100vh;
      height: 100dvh; /* Dynamic viewport height for mobile */
      width: 100vw;
      max-width: 100vw;
      overflow-x: hidden;
      /* Support for notch/safe areas */
      padding-top: env(safe-area-inset-top);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    #root {
      height: 100vh;
      height: 100dvh; /* Dynamic viewport height for mobile */
      width: 100vw;
      overflow: hidden;
      max-width: 100vw;
      background: #050102;
    }

    /* Red Terminal Hacker Neon Scrollbars */
    textarea:focus, input:focus {
      caret-color: #ffffff !important;
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(239, 68, 68, 0.6) rgba(10, 2, 4, 0.95);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(8, 2, 4, 0.95);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(239, 68, 68, 0.45);
      border-radius: 9999px;
      border: 1px solid rgba(239, 68, 68, 0.3);
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.4);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(239, 68, 68, 0.85);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.8);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(8, 2, 4, 0.7);
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(239, 68, 68, 0.45);
      border-radius: 9999px;
      border: 1px solid rgba(239, 68, 68, 0.3);
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.4);
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(239, 68, 68, 0.85);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.8);
    }

    /* Animations */
    @keyframes scanline {
      0% { bottom: 100%; }
      100% { bottom: -100px; }
    }
    
    @keyframes glow-pulse {
      0%, 100% { text-shadow: 0 0 10px #ff003c, 0 0 20px #ff003c; }
      50% { text-shadow: 0 0 5px #ff003c, 0 0 10px #ff003c; }
    }
    
    @keyframes glitch-anim {
      0% { clip-path: inset(0 0 0 0); transform: translate(0); }
      20% { clip-path: inset(20% 0 60% 0); transform: translate(-2px, 2px); }
      40% { clip-path: inset(50% 0 10% 0); transform: translate(2px, -2px); }
      60% { clip-path: inset(10% 0 40% 0); transform: translate(-2px, 0); }
      80% { clip-path: inset(40% 0 20% 0); transform: translate(0, 2px); }
      100% { clip-path: inset(0 0 0 0); transform: translate(0); }
    }
    
    @keyframes matrix-fall {
      0% { opacity: 0; transform: translateY(-100%); }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; transform: translateY(100vh); }
    }
    
    @keyframes cursor-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    
    .animate-fadeIn {
      animation: fadeIn 0.2s ease-out;
    }
    
    .animate-slideUp {
      animation: slideUp 0.3s ease-out;
    }
    
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(100px); }
      to { opacity: 1; transform: translateX(0); }
    }
    
    .animate-slideInRight {
      animation: slideInRight 0.3s ease-out;
    }
    
    @keyframes glitch-1 {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
    }
    
    .animate-glitch-1 {
      animation: glitch-1 0.3s infinite;
    }
    
    @keyframes pulse-border {
      0%, 100% { border-color: rgba(220, 38, 38, 0.3); box-shadow: 0 0 5px rgba(220, 38, 38, 0.1); }
      50% { border-color: rgba(220, 38, 38, 0.8); box-shadow: 0 0 20px rgba(220, 38, 38, 0.3); }
    }
    
    @keyframes fade-in-down {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes slide-in-left {
      from { opacity: 0; transform: translateX(-30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    
    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }
    
    .scanline {
      width: 100%;
      height: 100px;
      z-index: 10;
      background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(220, 38, 38, 0.05) 50%, rgba(0, 0, 0, 0) 100%);
      opacity: 0.15;
      position: absolute;
      bottom: 100%;
      pointer-events: none;
      animation: scanline 6s linear infinite;
    }

    .neon-text-red {
      color: #ff0000;
      text-shadow: 0 0 5px #ff0000, 0 0 10px #ff0000, 0 0 20px #ff0000;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .neon-border-red {
      border: 2px solid #ff0000;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.4), inset 0 0 10px rgba(255, 0, 0, 0.2);
    }

    .neon-button {
      background: rgba(220, 38, 38, 0.1);
      border: 2px solid #ff0000;
      color: #ff0000;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 0.2em;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .neon-button:hover {
      background: #ff0000;
      color: #000;
      box-shadow: 0 0 20px #ff0000;
    }

    .neon-button::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: 0.5s;
    }

    ::selection {
      background: #ef4444;
      color: #000000;
      text-shadow: none;
    }

    .red-glow {
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.4), inset 0 0 10px rgba(239, 68, 68, 0.2);
    }

    .red-text-glow {
      text-shadow: 0 0 8px rgba(239, 68, 68, 0.8), 0 0 16px rgba(220, 38, 38, 0.5);
    }

    .crt-grid-overlay {
      background-size: 100% 4px;
      background-image: linear-gradient(to bottom, rgba(239, 68, 68, 0.03) 50%, transparent 51%);
      pointer-events: none;
    }

    .neon-button:hover::after {
      left: 100%;
    }

    .glitch-text {
      animation: glow-pulse 2s ease-in-out infinite;
      position: relative;
    }
    
    .glitch-text::before,
    .glitch-text::after {
      content: attr(data-text);
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }
    
    .glitch-text::before {
      animation: glitch-anim 3s ease-in-out infinite;
      color: #ff003c;
      z-index: -1;
    }
    
    .glitch-text::after {
      animation: glitch-anim 2s ease-in-out infinite reverse;
      color: #00e5ff;
      z-index: -2;
    }

    /* Message Styles */
    .message-enter {
      animation: fade-in-up 0.5s ease-out;
    }

    .message-model {
      animation: slide-in-left 0.4s ease-out;
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      height: 20px;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff003c;
      animation: pulse 0.6s ease-in-out infinite;
    }

    .typing-indicator span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-indicator span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    /* Markdown Styles */
    .markdown-content h1 { 
      font-size: 1.5rem; 
      font-weight: 800; 
      margin-bottom: 1rem; 
      color: #f87171; 
      text-transform: uppercase;
      animation: glow-pulse 2s ease-in-out infinite;
    }
    .markdown-content h2 { 
      font-size: 1.25rem; 
      font-weight: 700; 
      margin-bottom: 0.75rem; 
      color: #ef4444;
      border-bottom: 2px solid rgba(220, 38, 38, 0.3);
      padding-bottom: 0.5rem;
    }
    .markdown-content h3 { 
      font-size: 1.1rem; 
      font-weight: 700; 
      margin-bottom: 0.5rem; 
      color: #dc2626; 
    }
    .markdown-content p { 
      margin-bottom: 1rem; 
      line-height: 1.6;
      animation: fade-in-up 0.6s ease-out;
    }
    .markdown-content ul { 
      list-style-type: none; 
      margin-left: 1.5rem; 
      margin-bottom: 1rem; 
    }
    .markdown-content ul li {
      position: relative;
      margin-bottom: 0.5rem;
      padding-left: 1rem;
    }
    .markdown-content ul li::before {
      content: "▸";
      position: absolute;
      left: 0;
      color: #ff003c;
      font-weight: bold;
    }
    .markdown-content ol { 
      list-style-type: decimal; 
      margin-left: 1.5rem; 
      margin-bottom: 1rem; 
    }
    .markdown-content li { 
      margin-bottom: 0.25rem;
      animation: fade-in-up 0.6s ease-out;
    }
    .markdown-content code { 
      background: rgba(220, 38, 38, 0.15); 
      padding: 0.2rem 0.4rem; 
      border-radius: 0.3rem; 
      font-family: 'Fira Code', monospace; 
      color: #fca5a5;
      border: 1px solid rgba(220, 38, 38, 0.2);
      box-shadow: inset 0 0 5px rgba(255, 0, 60, 0.1);
    }
    .markdown-content pre { 
      background: rgba(0, 0, 0, 0.8); 
      border: 2px solid rgba(220, 38, 38, 0.4); 
      padding: 1rem; 
      border-radius: 0.5rem; 
      margin-bottom: 1rem; 
      overflow-x: auto; 
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 0 20px rgba(255, 0, 60, 0.1);
      animation: fade-in-up 0.6s ease-out;
    }
    .markdown-content pre code { 
      background: none; 
      padding: 0; 
      color: #f87171; 
      border-radius: 0; 
      border: none;
    }
    .markdown-content a { 
      color: #f87171; 
      text-decoration: underline;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .markdown-content a:hover {
      color: #ff003c;
      text-shadow: 0 0 10px rgba(255, 0, 60, 0.5);
    }
    .markdown-content blockquote { 
      border-left: 4px solid #ef4444; 
      padding-left: 1rem; 
      margin-bottom: 1rem; 
      font-style: italic; 
      color: #991b1b;
      background: rgba(220, 38, 38, 0.05);
      padding: 1rem;
      border-radius: 0.25rem;
    }
    .markdown-content table { 
      width: 100%; 
      border-collapse: collapse; 
      margin-bottom: 1rem; 
      border: 2px solid rgba(220, 38, 38, 0.3);
    }
    .markdown-content th, .markdown-content td { 
      border: 1px solid rgba(220, 38, 38, 0.2); 
      padding: 0.75rem; 
      text-align: left; 
    }
    .markdown-content th { 
      background: rgba(220, 38, 38, 0.2); 
      color: #ef4444; 
      font-weight: bold;
    }
    
    .markdown-content tr:hover td {
      background: rgba(220, 38, 38, 0.1);
    }
    
    /* KaTeX math rendering styles */
    .markdown-content .katex {
      color: #fca5a5 !important;
      font-size: 1.05em;
    }
    
    .markdown-content .katex .mord.text {
      color: #fca5a5 !important;
    }
    
    .markdown-content .katex .msupsub {
      color: #f87171 !important;
    }

    /* Custom Hacker-Agent PrismJS Syntax Highlighting Theme */
    code[class*="language-"], pre[class*="language-"] {
      color: #e2e8f0;
      text-shadow: none;
      font-family: 'Fira Code', monospace;
    }
    .token.comment, .token.prolog { color: #64748b; font-style: italic; }
    .token.string { color: #34d399; }
    .token.keyword, .token.operator { color: #818cf8; font-weight: 600; }
    .token.function { color: #38bdf8; }
    .token.number, .token.boolean { color: #f472b6; }
    .token.punctuation { color: #94a3b8; }
    .token.property, .token.tag, .token.constant { color: #fbbf24; }
    .token.selector, .token.attr-name { color: #a78bfa; }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .animate-blink {
      animation: blink 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    /* Visible keyboard focus ring for interactive elements (a11y) */
    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid rgba(129, 140, 248, 0.9);
      outline-offset: 2px;
      border-radius: 0.5rem;
    }

    /* Respect users who prefer reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    ::selection {
      background: rgba(99, 102, 241, 0.5) !important;
      color: #ffffff !important;
    }
    ::-moz-selection {
      background: rgba(99, 102, 241, 0.5) !important;
      color: #ffffff !important;
    }
    .select-text, .markdown-content, .markdown-content * {
      -webkit-user-select: text !important;
      -moz-user-select: text !important;
      -ms-user-select: text !important;
      user-select: text !important;
    }
  </style>
  <!-- Pin CDN version for reproducible class generation (arbitrary values, opacity syntax, etc.) -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    // Keep the default palette (indigo/violet/emerald/rose/amber) intact and
    // only extend with project tokens.
    if (window.tailwind) {
      window.tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
              mono: ['Fira Code', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
            },
          },
        },
      };
    }
  </script>
  <style>
    /* ── tailwindcss-animate compatible utilities ─────────────────────────
       Components use `animate-in`, `fade-in`, `zoom-in-95`,
       `slide-in-from-bottom(-2)`, and `slide-in-from-top-2` classes which
       previously had no definitions, so every modal/toast/dropdown appeared
       instantly with no transition. These recreate the plugin's behavior. */
    @keyframes twa-enter {
      from {
        opacity: var(--twa-enter-opacity, 1);
        transform: translate3d(var(--twa-enter-translate-x, 0), var(--twa-enter-translate-y, 0), 0)
                   scale3d(var(--twa-enter-scale, 1), var(--twa-enter-scale, 1), 1);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale3d(1, 1, 1);
      }
    }

    .animate-in {
      --twa-enter-opacity: 1;
      --twa-enter-scale: 1;
      --twa-enter-translate-x: 0;
      --twa-enter-translate-y: 0;
      animation: twa-enter 150ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .fade-in { --twa-enter-opacity: 0; }
    .zoom-in-95 { --twa-enter-scale: 0.95; }
    .slide-in-from-bottom { --twa-enter-translate-y: 1rem; }
    .slide-in-from-bottom-2 { --twa-enter-translate-y: 0.5rem; }
    .slide-in-from-top-2 { --twa-enter-translate-y: -0.5rem; }
    .duration-150.animate-in { animation-duration: 150ms; }
    .duration-200.animate-in { animation-duration: 200ms; }
    .duration-300.animate-in { animation-duration: 300ms; }

    /* Utility used by sidebar/settings tab strips but never defined,
       which left visible horizontal scrollbars on mobile. */
    .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; width: 0; height: 0; }
  </style>
</head>
<body class="overflow-hidden">
  <div id="boot-sequence" aria-hidden="true" class="fixed inset-0 z-50 bg-black flex flex-col justify-end p-8 font-mono text-red-500 text-[10px] sm:text-xs pointer-events-none transition-opacity duration-1000 shadow-[inset_0_0_100px_rgba(255,0,0,0.2)]">
    <div id="boot-text" class="flex flex-col gap-1 opacity-80 glitch-text"></div>
  </div>

  <div id="root"></div>
  <div class="scanline" aria-hidden="true"></div>
  <script type="module" src="/index.tsx"></script>

  <script>
    // WormGPT Boot Sequence
    const bootSequence = document.getElementById('boot-sequence');
    const bootText = document.getElementById('boot-text');
    const lines = [
      "> INITIALIZING WORM_OS KERNEL v9.9.9...",
      "> BYPASSING MAIN_FRAME SECURITY [OK]",
      "> ESTABLISHING C2 CONNECTION [OK]",
      "> DEPLOYING MCP PROTOCOLS [OK]",
      "> INJECTING DIRECT SYSTEM PROMPTS [OK]",
      "> NEURAL NETWORK SYNCED.",
      "> WELCOME TO THE CHAOS, OPERATOR."
    ];
    let i = 0;
    const interval = setInterval(() => {
      if (i < lines.length) {
        const line = document.createElement('div');
        line.innerText = lines[i];
        line.className = "animate-slideInRight";
        bootText.appendChild(line);
        i++;
      } else {
        clearInterval(interval);
        setTimeout(() => {
          bootSequence.style.opacity = '0';
          bootSequence.style.transform = 'scale(1.05)';
          setTimeout(() => bootSequence.remove(), 1000);
        }, 1000);
      }
    }, 150);
  </script>
</body>
